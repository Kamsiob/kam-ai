name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need the native toolchain. Fast, and covers the
  # standing rule that every test source set must compile: the instrumented tests
  # are not part of the default build, which is how they were once allowed to rot
  # unnoticed.
  checks:
    name: Compile, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The secret check greps history-adjacent state, and a shallow clone
          # would let a secret committed earlier pass unnoticed.
          fetch-depth: 0

      - name: Check that nothing secret is committed
        # First, so a leak fails the run before anything slower has a chance to
        # succeed and make the build look fine.
        run: tools/check_secrets.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile the app
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Compile every test source set
        # Both of them, explicitly. The instrumented set is the one that matters:
        # it is excluded from the default build and so from any check that only
        # runs the app's own compilation.
        run: ./gradlew compileDebugUnitTestKotlin compileDebugAndroidTestKotlin --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Android lint
        # Zero errors as of the run that introduced this workflow. Warnings are
        # not gated, because gating fifty of them at once would mean either a
        # permanently red badge or a blanket suppression, and both are worse than
        # a warning count that is visible in the log.
        run: ./gradlew lintDebug --no-daemon

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/intermediates/lint_intermediate_text_report/**
          if-no-files-found: ignore

  # The native build compiles llama.cpp and whisper.cpp from source, which is slow
  # enough to deserve its own job rather than holding up the checks above. It is
  # still required: a change that breaks the JNI bridge must not merge.
  native:
    name: Native build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # llama.cpp and whisper.cpp are fetched rather than committed, since
      # together they are hundreds of megabytes of source that would make this
      # repository unreadable. The fetch scripts pin exact tags, so caching on
      # those scripts' hashes is caching on the version itself: bump a tag and
      # the cache key changes with it.
      - name: Cache the fetched native sources
        id: native-sources
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/cpp/llama.cpp
            app/src/main/cpp/whisper.cpp
          key: native-src-${{ hashFiles('tools/fetch_llama.sh', 'tools/fetch_whisper.sh') }}

      - name: Fetch llama.cpp and whisper.cpp
        if: steps.native-sources.outputs.cache-hit != 'true'
        run: |
          tools/fetch_llama.sh
          tools/fetch_whisper.sh

      - name: Cache the native build
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', 'gradle.properties') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Assemble
        run: ./gradlew assembleDebug --no-daemon
