org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Pinned toolchain. Kept here so one edit changes it everywhere.
kamai.ndkVersion=28.2.13676358
kamai.cmakeVersion=3.31.6

# Where to find JDK 21 for the unit tests. This machine's default JDK is 26, which
# Robolectric 4.16.1 cannot instrument against, so the test task alone runs on 21 while
# everything else still compiles on 26. Both are installed through Homebrew, a user-level
# prefix, because /usr is immutable on this host. Gradle's own auto-detection does not look
# inside the Homebrew prefix, hence this line. See DECISIONS.md, "Robolectric and JDK 26".
org.gradle.java.installations.paths=/home/linuxbrew/.linuxbrew/opt/openjdk@21/libexec

# KSP 2.0.x still registers its generated sources through the Kotlin source set
# DSL, which AGP 9's built-in Kotlin rejects by default. The generated code lands
# in the right place either way. Remove this once KSP ships built-in Kotlin
# support. See DECISIONS.md.
android.disallowKotlinSourceSets=false
